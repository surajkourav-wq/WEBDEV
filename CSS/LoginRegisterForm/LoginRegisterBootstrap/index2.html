<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body class="bg-primary">
    <div class="outerdiv row d-flex align-items-end mb-5 justify-content-center vh-100 gap-5">
      <div class="card col-3 pt-3 ps-4 rounded-3 " id="login">
        <div class="pb-4" id="row1">
          <h1><span class="text-decoration-underline link-underline-primary">Lo</span>gin</h1>
        </div>
        <div class="d-flex  input-group">
          <i class="bi bi-envelope"></i>
          <input type="email" placeholder="Email" class="form-control border-0" />
        </div>
        <div class="d-flex align-items-center input-group">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Password" class="form-control border-0"/>
          <i class="bi bi-eye"></i>
        </div>
        <div class="d-flex justify-content-between">
          <span><input type="checkbox" /> Remember Me</span>
          <a href="#" class="text-decoration-none">Forget Password</a>
        </div>
        <div>
            <button type="submit" class="custom bg-primary text-light w-100 d-flex align-items-center justify-content-center">Login now</button>
        </div>
        <div class="d-flex justify-content-center gap-1">
          <p>Don't Have Account?</p>
          <a href="#" class="text-decoration-none">Signup Now</a>
        </div>
      </div>

      <div class="card col-3 pt-3 ps-4 rounded-3 pe-4 bg-light" id="register">
        <div class="pb-4" id="row1">
          <h1><span class="text-decoration-underline link-underline-primary">Re</span>gister</h1>
        </div>
        <div class="d-flex align-items-center input-group">
          <i class="bi bi-person"></i>
          <input type="text" placeholder="Name" class="form-control border-0" />
        </div>
        <div class="d-flex align-items-center input-group">
          <i class="bi bi-envelope"></i>
          <input type="email" placeholder="Email" class="form-control border-0" />
        </div>
        <div class="d-flex align-items-center input-group">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Create Password" class="form-control border-0"/>
        </div>
        <div class="d-flex align-items-center input-group">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Confirm Password" class="form-control border-0"/>
          <i class="bi bi-eye"></i>
        </div>
        <div class="d-flex justify-content-between">
          <span><input type="checkbox" /> I agree all Terms and Condition</span>
        </div>
        <div>
            <button type="submit" class="custom bg-primary text-light w-100 d-flex align-items-center justify-content-center">Register now</button>
        </div>
        <div class="d-flex justify-content-center gap-1">
          <p>Already Have Account?</p>
          <a href="#" class="text-decoration-none">Login Now</a>
        </div>
      </div>
    </div>

    <!-- BootStrap Script  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
