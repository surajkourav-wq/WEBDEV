<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="d-flex flex-column gap-2 justify-content-center align-items-center vh-100"
    >
      <div
        class="rounded-top-5 top border border-1 border-dark d-flex align-items-center justify-content-end"
      >
        <!-- <input type="number" class="bg-transparent w-100 border-0"> -->
        <label for="text" class="fs-3 text-end me-3">0</label>
      </div>
      <div class="down h-50 border border-1 border-dark rounded-bottom-5">
        <div class="d-flex gap-4 mt-3 ms-3">
          <button class="bg-white border-0 cmnbtn" onclick="Calculate('AC')">AC</button>
          <button class="bg-white border-0 cmnbtn" onclick="Calculate('AC')">C</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">%</button>
          <button class="bg-warning rounded-circle p-3 border-0 btnylw">/</button>
        </div>
        <div class="d-flex gap-4 mt-3 ms-3">
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">7</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">8</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">9</button>
          <button class="bg-warning rounded-circle p-3 border-0 btnylw">*</button>
        </div>
        <div class="d-flex gap-4 mt-3 ms-3">
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-warning rounded-circle p-3 border-0 btnylw">AC</button>
        </div>
        <div class="d-flex gap-4 mt-3 ms-3">
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button class="bg-warning rounded-circle p-3 border-0 btnylw">AC</button>
        </div>
        <div class="d-flex gap-4 mt-3">
          <button class="bg-white rounded-circle p-3 border-0 ms-3 cmnbtn">AC</button>
          <button class="bg-white rounded-circle p-3 border-0 cmnbtn">AC</button>
          <button
            class="bg-success text-white rounded-pill p-3 border-0 me-3 w-50"
          >
            AC
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
