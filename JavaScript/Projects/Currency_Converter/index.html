<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- <style>
      body {
        background-image: url(CC.jpg);
      }
    </style> -->
  </head>
  <body class="bg-info">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow border-0">
            <div class="card-body p-4">
              <h1 class="text-center fw-bold mb-4">Currency Converter</h1>

              <div class="mb-4">
                <label for="orgAmount" class="form-label fw-semibold">
                  Enter Amount
                </label>
                <input
                  type="number"
                  id="orgAmount"
                  class="form-control form-control-lg"
                  placeholder="Enter amount"
                />
                <div id="amountError" class="text-danger mt-2"></div>
              </div>

              <div class="row g-4 align-items-end">
                <div class="col-12 col-md-5">
                  <div class="text-center mb-3">
                    <img
                      id="flag1"
                      src="https://flagsapi.com/${countryCode}/flat/64.png"
                      alt="From Country Flag"
                    />
                  </div>
                  <label for="country1" class="form-label fw-semibold">
                    From
                  </label>
                  <select id="country1" class="form-select form-select-lg">
                    <option value="">Select Country</option>
                  </select>
                  <div id="country1Error" class="text-danger mt-2"></div>
                </div>

                <div class="col-12 col-md-2 text-center">
                  <button
                    id="swapBtn"
                    class="btn btn-primary p-3 w-100 rounded-4"
                  >
                    <i class="bi bi-arrow-left-right"></i>
                  </button>
                </div>

                <div class="col-12 col-md-5">
                  <div class="text-center mb-3">
                    <img
                      id="flag2"
                      src="https://flagsapi.com/${countryCode}/flat/64.png"
                      alt="To Country Flag"
                    />
                  </div>
                  <label for="country2" class="form-label fw-semibold">
                    To
                  </label>
                  <select id="country2" class="form-select form-select-lg">
                    <option value="">Select Country</option>
                  </select>
                  <div id="country2Error" class="text-danger mt-2"></div>
                </div>
              </div>

              <div class="d-grid mt-4">
                <button
                  id="convertBtn"
                  class="btn btn-success p-3"
                >
                  Convert
                </button>
              </div>

              <div id="loadingText" class="text-center mt-3 d-none">
                <div
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                ></div>
                Converting...
              </div>

              <div
                id="resultBox"
                class="alert alert-primary text-center mt-4 mb-0 d-none"
              >
                <h3 id="newAmount" class="fw-bold mb-2"></h3>

                <p id="exchangeRate" class="mb-0"></p>
              </div>

              <div id="generalError" class="alert alert-danger mt-4 d-none">
                Something went wrong. Please try again.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
