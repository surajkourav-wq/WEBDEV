<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <div class="w-25 bg-light rounded shadow border mx-auto mt-5 p-4">
      <h1 class="text-center mb-3 ">Age Calculator</h1>

      <form class="d-flex flex-column gap-3 align-items-center p-3 w-100"> 
        <label for="DOB">Enter your date of birth</label>
        <input type="date" name="DOB" id="DOB" class="form-control">
        <label for="CurrentDate">Choose Current Date</label>
        <input type="date" name="CurrentDate" id="CurrentDate" class="form-control">
        <button type="submit" class="btn btn-primary">Calculate Age</button>
      </form>

      <div class="fw-bold text-center">
        Your agr is : <span id="MyAge">xx</span>  Years
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
