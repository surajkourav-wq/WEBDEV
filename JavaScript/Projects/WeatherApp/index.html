<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mausam ka haal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-dark text-light p-3 text-center shadow">
      <h2 class="fw-bold">
        <i class="bi bi-cloud-sun-fill text-warning"></i>
        Mausam ka haal
      </h2>
    </header>

    <div
      class="container card border-0 shadow-lg rounded-4 w-50 p-5 d-flex justify-content-center mt-5 align-items-center gap-4"
    >
      <div class="d-flex gap-2 w-100">
        <input
          type="text"
          id="cityName"
          class="form-control form-control-lg"
          placeholder="Enter City/State Name"
        />

        <button onclick="getWeather()" class="btn btn-warning fw-bold px-4">
          Search
        </button>
      </div>

      <div class="text-center">
        <h1 class="display-3 fw-bold text-primary">
          <span id="Temperature"></span>ºC
        </h1>

        <!-- <h4 class="text-secondary">
          <span id="weather"></span>
        </h4> -->

        <p class="text-muted text-capitalize">
          <span id="type"></span>
        </p>
      </div>

      <div
        class="d-flex flex-column justify-content-between align-items-center gap-4 w-100"
      >
        <div class="d-flex justify-content-between gap-4 w-100">
          <div
            class="bg-light rounded-4 p-4 w-50 d-flex flex-column gap-2 shadow-sm"
          >
            <label class="fw-semibold">
              <i class="bi bi-thermometer-half text-danger"></i>
              Feels Like :
              <span id="feels"></span>ºC
            </label>

            <label class="fw-semibold">
              <i class="bi bi-thermometer-low text-info"></i>
              Min Temp :
              <span id="min_temp"></span>ºC
            </label>

            <label class="fw-semibold">
              <i class="bi bi-moisture text-primary"></i>
              Humidity :
              <span id="humid"></span>%
            </label>
          </div>

          <div
            class="bg-light rounded-4 p-4 w-50 d-flex flex-column gap-2 shadow-sm"
          >
            <label class="fw-semibold">
              <i class="bi bi-wind text-success"></i>
              Speed :
              <span id="speed"></span> km/h
            </label>

            <label class="fw-semibold">
              <i class="bi bi-thermometer-high text-warning"></i>
              Max Temp :
              <span id="max_temp"></span>ºC
            </label>

            <label class="fw-semibold">
              <i class="bi bi-cloud-fill text-secondary"></i>
              Weather :
              <span id="weather"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <br />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
