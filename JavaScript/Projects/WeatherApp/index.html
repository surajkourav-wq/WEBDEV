<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mausam ka haal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-info">
    <header class="bg-primary text-light p-2 text-center">
      <h2>Mausam ka haal</h2>
    </header>

    <div class="container card w-50 align-items-center p-5 d-flex justify-content-center mt-4 flex-column align-items-center gap-3">
      <div>
        <input type="text" id="cityName" placeholder="Enter City/State Name" class=""/>
        <button onclick="getWeather()" class="btn btn-warning ">Get Weather</button>
      </div>

      <div class="d-flex flex-column gap-3">
        <label>Temp : <span id="Temperature"></span>ºC</label>
        <label>Feels Like : <span id="feels"></span>ºC</label>
      </div>
    </div>

    <br />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
