<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-3">
              <h2 class="mb-0">Salary Calculator</h2>
            </div>

            <div class="card-body p-4">
              <!-- Input -->
              <div class="mb-3">
                <label for="basicSalary" class="form-label fw-bold">
                  Basic Salary
                </label>

                <input
                  type="number"
                  id="basicSalary"
                  class="form-control"
                  placeholder="Enter Basic Salary"
                />

                <div id="errorMsg" class="text-danger mt-2"></div>

                <div id="successMsg" class="success-text mt-2"></div>
              </div>

              <!-- Buttons -->
              <div class="d-flex gap-2 mb-3">
                <button id="calculateBtn" class="btn btn-primary w-100">
                  Calculate Gross Salary
                </button>

                <button id="resetBtn" class="btn btn-secondary w-100">
                  Reset
                </button>
              </div>

              <!-- Loader -->
              <div id="loader" class="mb-3"></div>

              <!-- Result -->
              <div class="result-box">
                <h4 class="text-primary mb-3">Salary Details</h4>

                <div class="d-flex justify-content-between border-bottom py-2">
                  <span>Basic Salary</span>
                  <span id="basicResult">₹0.00</span>
                </div>

                <div class="d-flex justify-content-between border-bottom py-2">
                  <span>HRA</span>
                  <span id="hraResult">₹0.00</span>
                </div>

                <div class="d-flex justify-content-between border-bottom py-2">
                  <span>DA</span>
                  <span id="daResult">₹0.00</span>
                </div>

                <div class="d-flex justify-content-between py-2 fw-bold">
                  <span>Gross Salary</span>
                  <span id="grossResult">₹0.00</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
