<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <div>
        <h1 class="text-center bg-primary p-3">Registration Form</h1>

        <div
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <h3 class="mt-3 mb-0">Personal Information</h3>

          <div class="d-flex flex-column gap-3 w-50 justify-content-center">
            <label for="fullName">Full Name:</label>
            <input
              type="text"
              name="fullName"
              id="fullName"
              placeholder="Enter Full Name"
              required
            />
            <label for="email">Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Enter Email Address"
              required
            />
            <label for="number">Mobile Number:</label>
            <input
              type="tel"
              name="number"
              id="number"
              placeholder="Enter Your Number"
              required
            />
            <div class="d-flex align-items-center gap-2">
              <label for="gender">Gender:</label>
              <div><input type="radio" name="gender" id="gender" /> Male</div>
              <div><input type="radio" name="gender" id="gender" /> Female</div>
              <div><input type="radio" name="gender" id="gender" /> Others</div>
            </div>
            <label for="fullName">Date Of Birth:</label>
            <input type="date" name="DOB" id="DOB" required />
          </div>
        </div>

        <div
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <h3 class="mt-5 mb-0">Academic Details</h3>

          <div class="d-flex flex-column gap-3 w-50 justify-content-center">
            <label for="Qualification">Last Completed Qualification:</label>
            <select name="Qualification" id="Qualification" required>
              <option value="">Select Last Completed Qualification</option>
              <option value="10">10th</option>
              <option value="12">12th</option>
              <option value="Graduate">Graduate</option>
              <option value="PostGraduate">PostGraduate</option>
            </select>

            <label for="Grade">Percentage/Grade in Last Qualification:</label>
            <select name="Grade" id="Grade" required>
              <option value="">
                Select Percentage/Grade in Last Qualification
              </option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
            </select>
          </div>
        </div>

        <div
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <h3 class="mt-5 mb-0">Course Information</h3>

          <div class="d-flex flex-column gap-3 w-50 justify-content-center">
            <label for="Course"> Preferred Course:</label>
            <select name="Course" id="Course" required>
              <option value="">Select Preferred Course</option>
              <option value="IIT-JEE">IIT-JEE</option>
              <option value="NEET">NEET</option>
              <option value="Banking Exams">Banking Exams</option>
              <option value="UPSC">UPSC</option>
            </select>

            <label for="Timing">Batch Timing Preference:</label>
            <select name="Timing" id="Timing" required>
              <option value="">Select Batch Timing Preference</option>
              <option value="Morning">Morning</option>
              <option value="Afternoon">Afternoon</option>
              <option value="Evening">Evening</option>
              <option value="Weekend">Weekend</option>
            </select>
          </div>
        </div>

        <div
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <h3 class="mt-5 mb-0">Address</h3>

          <div class="d-flex flex-column gap-3 w-50 justify-content-center">
            <label for="Address">Residential Address:</label>
            <textarea name="Address" id="Address"></textarea>
            <label for="City">City:</label>
            <input
              type="text"
              name="City"
              id="City"
              placeholder="Enter Your City"
              required
            />
            <label for="number">Pin Code:</label>
            <input
              type="number"
              name="number"
              id="number"
              placeholder="Enter Pin Code"
              required
            />
          </div>
        </div>
      </div>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
