<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Bill Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow">
            <div class="card-header bg-primary text-white text-center py-3">
              <h2>Travel Bill Calculator</h2>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="kmInput" class="form-label fw-bold">
                  Kilometers Covered
                </label>
                <input
                  type="number"
                  id="kmInput"
                  class="form-control"
                  placeholder="Enter kilometres"
                />
                <div id="errorMsg" class="text-danger mt-2"></div>
              </div>
              <div class="d-grid mb-4">
                <button id="calcBtn" class="btn btn-primary">
                  Calculate Bill
                </button>
              </div>
              <div class="card">
                <div class="card-body">
                  <h3 class="text-primary fw-bold">
                    Total Bill = Rs.
                    <span id="totalBill">0</span>
                  </h3>

                  <hr />

                  <h5>Calculation Breakdown</h5>
                  
                  <div id="breakdown">
                    <p class="text-muted">No calculation yet.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
