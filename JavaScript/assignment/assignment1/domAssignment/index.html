<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Assignment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- 1 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <h1 id="myHeading">This is DOM heading</h1>

      <button onclick="heading()">submit</button>
    </div>

    <!-- 2 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <p id="myPara">this is paragraph text</p>

      <button onclick="paraChange()">click me</button>
    </div>

    <!-- 3 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <h1 id="myHeading2">click on button</h1>

      <button onclick="heading2()">click</button>
    </div>

    <!-- 4 -->
    <p id="myPara2">this is paragraph content</p>

    <!-- 5 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <div id="myElement">Old Content</div>

      <button onclick="changeContent()">Change Content</button>
    </div>

    <!-- 6 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <p id="text">Hello</p>

      <button onclick="changeText()">Click Me</button>
    </div>

    <!-- 7 -->
    <div class="d-flex container justify-content-between mt-5 mb-5">
      <h1 id="heading">Original Heading</h1>
    <p id="para">Original Paragraph</p>

    <button onclick="changeContent2()">Change Both</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
